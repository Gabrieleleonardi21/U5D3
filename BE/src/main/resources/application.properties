# [.properties] dice a Spring in che formato leggere env.local (file senza estensione).
# optional: l'app parte lo stesso su un pc dove env.local non esiste (es. dopo un clone).
spring.config.import=optional:file:env.local[.properties]
spring.application.name=u5d3

# Il database u5d3 va creato PRIMA di avviare: Hibernate crea le tabelle, non il database.
spring.datasource.url=jdbc:postgresql://localhost:5432/u5d3
spring.datasource.username=postgres
# ${VAR:default}: se DB_PASSWORD esiste in env.local vince lei, altrimenti si usa "postgres".
# Cosi' la password vera non finisce mai dentro il repository.
spring.datasource.password=${DB_PASSWORD:postgres}

# update: all'avvio Hibernate legge le classi @Entity e crea/aggiorna le tabelle.
# Va bene per un esercizio, NON in produzione (li' si usano le migrazioni).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# false: la sessione Hibernate si chiude col service. Se restasse aperta fino alla
# serializzazione JSON, Jackson potrebbe far partire query lazy a nostra insaputa.
spring.jpa.open-in-view=false

# L'origine del front-end Vite. Letta da CorsConfig: cambiando porta al FE
# basta modificare questa riga (o esportare ALLOWED_ORIGIN), non il codice Java.
app.cors.allowed-origin=${ALLOWED_ORIGIN:http://localhost:5173}

server.port=3001

# --- OCR (Tesseract) ---
# Cartella dei file .traineddata, uno per lingua. Su questo Mac la riempie
# "brew install tesseract-lang"; su un altro pc il percorso cambia, per questo
# e' una proprieta' e non una costante nel codice.
app.ocr.datapath=${OCR_DATAPATH:/opt/homebrew/share/tessdata}
# Tess4J non contiene il motore OCR: lo carica via JNA da questa cartella.
# Senza, all'avvio del primo scan si ottiene "Unable to load library 'tesseract'".
app.ocr.native-lib-path=${OCR_NATIVE_LIB_PATH:/opt/homebrew/lib}
# Lingua usata quando il front-end non ne indica una.
app.ocr.default-language=ita

# --- Upload ---
# Dove finiscono i file caricati. Percorso relativo alla cartella da cui parte l'app.
app.upload.dir=${UPLOAD_DIR:uploads}
# Di default Spring accetta al massimo 1MB: una scansione lo supera facilmente.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
